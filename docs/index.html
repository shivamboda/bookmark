<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bookmark - A personal floral book tracking journal">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1E1611">

  <!-- iOS Safari standalone meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon-precomposed" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bookmark</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent iOS rubber-banding and ensure seamless floral cream background */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1E1611;
      overflow: hidden;
      touch-action: pan-x pan-y;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
    <script>
    // iOS Safari PWA background resume watchdog & touch unfreeze
    (function() {
      function onResume(source) {
        // 1. Drop any stuck input / virtual keyboard focus
        try {
          if (document.activeElement && typeof document.activeElement.blur === "function") {
            document.activeElement.blur();
          }
        } catch (e) {}

        // 2. Reset any Safari viewport shift/drift
        try {
          window.scrollTo(0, 0);
          if (document.body) document.body.scrollTop = 0;
          if (document.documentElement) document.documentElement.scrollTop = 0;
        } catch (e) {}

        // 3. Wake up WebKit compositor by dispatching a resize event
        try {
          window.dispatchEvent(new Event("resize"));
        } catch (e) {}

        // 4. Ensure no lingering splash or overlay traps pointer events
        try {
          var strayElements = document.querySelectorAll(".splash, #splash, .loading, #loading, [data-splash]");
          for (var i = 0; i < strayElements.length; i++) {
            strayElements[i].style.pointerEvents = "none";
          }
        } catch (e) {}
      }

      document.addEventListener("visibilitychange", function() {
        if (!document.hidden) {
          onResume("visibilitychange");
        }
      });

      window.addEventListener("pageshow", function(e) {
        onResume("pageshow" + (e.persisted ? "-persisted" : ""));
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
