              if (document.documentElement) document.documentElement.scrollTop = 0;

          // Only dispatch if NOT triggered directly by a visualViewport event to avoid loops
          if (source !== 'visualViewport-resize' && window.visualViewport) {
            try {
              window.visualViewport.dispatchEvent(new Event("resize"));
            } catch (e) {}
          }

          // Also dispatch to window for window-level listeners

            try {
              window.dispatchEvent(new Event("resize"));
            } catch (e) {}

          // Ensure no lingering splash or overlay traps pointer events
          try {
            var strayElements = document.querySelectorAll(".splash, #splash, .loading, #loading, [data-splash]");
            for (var i = 0; i < strayElements.length; i++) {
              strayElements[i].style.pointerEvents = "none";
            }
          } catch (e) {}
        } finally {

        }

      // Background resume watchdog (ONLY called on actual resume from background)

      window.addEventListener("resize", function() {

      // iOS WebKit in standalone mode often reports pre-settled (shorter) dimensions during Flutter's
      // first frame layout, then settles into full standalone height without firing an event.
      // Running a timed cascade forces Flutter to re-query visualViewport metrics as WebKit settles.
      var coldStartDelays = [50, 150, 300, 500, 800, 1200, 2000];
      for (var k = 0; k < coldStartDelays.length; k++) {
        (function(delay) {
          setTimeout(function() {
            var curH = window.visualViewport ? window.visualViewport.height : window.innerHeight;

              syncViewportGeometry("coldStart-" + delay + "ms");
            }

      }

      var rAFCount = 0;
      function checkEarlyRAF() {
        var curH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        if (Math.abs(curH - initialHeight) > 0.5) {

          syncViewportGeometry("rAF-" + rAFCount);

          requestAnimationFrame(checkEarlyRAF);
        }

      requestAnimationFrame(checkEarlyRAF);

      // App background/resume watchdogs: ONLY these events should ever drop stuck background focus!
      document.addEventListener("visibilitychange", function() {

      window.addEventListener("pageshow", function(e) {
